project:
  name: us-treasury-risk-management
  version: 0.1.0
  description: >
    Risk-managed minimum variance portfolios for U.S. Treasury securities
    using Rolling Covariance, EWMA, and VAR-based models.
  author: Younghoon Chang
  timezone: America/New_York

data:
  source: FRED
  instruments:
    # Treasury yields (rate level)
    - DGS1          # 1Y Treasury Yield
    - DGS2          # 2Y Treasury Yield
    - DGS5          # 5Y Treasury Yield
    - DGS10         # 10Y Treasury Yield
    - DGS30         # 30Y Treasury Yield
    # Yield curve spreads (term structure risk)
    - T10Y2Y        # 10Y-2Y Treasury Spread
    - T10Y3M        # 10Y-3M Treasury Spread
    # Credit spreads (credit risk)
    - BAMLC0A0CM    # ICE BofA IG Corporate OAS
    - BAMLH0A0HYM2  # ICE BofA HY Corporate OAS
    - BAA10Y        # Moody's Baa minus 10Y Treasury
    # Inflation expectations
    - T5YIE         # 5Y Breakeven Inflation Rate
    - T10YIE        # 10Y Breakeven Inflation Rate
    # Volatility / systemic stress
    - VIXCLS        # CBOE VIX Index
  frequency: daily
  start_date: 1997-01-01
  end_date: null
  return_type: duration_adj
  interpolation: ffill
  missing_handling: drop
  instrument_metadata:
    DGS1:          {type: treasury_yield, duration: 1.0}
    DGS2:          {type: treasury_yield, duration: 1.9}
    DGS5:          {type: treasury_yield, duration: 4.5}
    DGS10:         {type: treasury_yield, duration: 8.5}
    DGS30:         {type: treasury_yield, duration: 19.5}
    T10Y2Y:        {type: spread, spread_duration: 7.0, scale: 0.01}
    T10Y3M:        {type: spread, spread_duration: 8.0, scale: 0.01}
    BAMLC0A0CM:    {type: spread, spread_duration: 7.0, scale: 0.01}
    BAMLH0A0HYM2:  {type: spread, spread_duration: 4.0, scale: 0.01}
    BAA10Y:        {type: spread, spread_duration: 7.0, scale: 0.01}
    T5YIE:         {type: spread, spread_duration: 5.0, scale: 0.01}
    T10YIE:        {type: spread, spread_duration: 8.5, scale: 0.01}
    VIXCLS:        {type: index, return_method: simple}

portfolio:
  objective: minimum_variance
  constraints:
    long_only: true
    weight_sum: 1
    leverage: false
    max_weight: 0.40
  rebalance_frequency: monthly
  transaction_cost_bps: 5

models:
  rolling_cov:
    enabled: true
    window: 252
    shrinkage: ledoit_wolf
    annualization_factor: 252
  ewma:
    enabled: true
    lambda: 0.94
    annualization_factor: 252
  var:
    enabled: true
    lags: 1
    forecast_horizon: 1
    covariance_from_residuals: true
    annualization_factor: 252

risk_metrics:
  volatility: true
  sharpe_ratio: true
  max_drawdown: true
  turnover: true
  var_95: true

evaluation:
  out_of_sample: true
  oos_start: 2005-01-01
  benchmark:
    - equal_weight
    - duration_weighted
    - treasuries_only
  performance_window: rolling_36m

web:
  framework: streamlit
  host: localhost
  port: 8501
  interactive_weights: true
  interactive_model_toggle: true
  export_csv: true
  export_png: true

shocks:
  enabled: false
  source: csv
  csv_path: data/shock_data/romer_romer_shocks.csv
  shock_column: rr_shock
  cumulate: false
  shock_window_months: 3

irf:
  enabled: false
  max_horizon: 24
  n_lags: 4
  confidence_level: 0.90
  output_dir: output/irf

shock_conditioned:
  enabled: false
  scale_factor: 1.0
  response_horizon: 12

logging:
  level: INFO
  save_weights: true
  save_cov_matrices: false
  save_forecasts: true

reproducibility:
  random_seed: 42
  save_config_snapshot: true
